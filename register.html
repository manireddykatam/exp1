<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account | KL Eats</title><link rel="stylesheet" href="style.css"></head>
<body data-page="auth"><div id="siteHeader"></div><main class="auth-wrap"><section class="auth-card"><span class="eyebrow">JOIN THE TABLE</span><h1>Create your account</h1><p>Save your details and make your next order even easier.</p><form id="registerForm" class="form-stack"><div id="formMessage" class="form-message"></div><div class="field"><label for="name">Full name</label><input id="name" type="text" placeholder="Your name" required></div><div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" minlength="6" placeholder="At least 6 characters" required></div><div class="field"><label for="mobile">Mobile number</label><input id="mobile" type="tel" pattern="[0-9]{10}" placeholder="10-digit mobile number" required><small>Used only for this local demo account.</small></div><button class="btn btn-primary" type="submit">Create account</button></form><div class="auth-foot">Already have an account? <a href="login.html">Log in here</a></div></section></main><script src="script.js"></script></body></html>
